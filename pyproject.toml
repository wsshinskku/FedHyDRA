[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fedhydra"
version = "0.1.0"
description = "Research implementation of FedHyDRA for structured non-IID federated learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Wooseok Shin"},
  {name = "Janghoon Yang"},
  {name = "Zhiqiang Shen"},
  {name = "Jitae Shin"},
]
keywords = ["federated-learning", "non-iid", "vgae", "gmm", "mmd"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.3,<2",
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<10",
  "pytest-cov>=4.1,<8",
  "ruff>=0.4,<1",
]

[project.scripts]
fedhydra = "fedhydra.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
